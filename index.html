<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>室町幕府の成立と統治機構・社会文化 全問題クイズ</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark: rgba(20, 24, 33, 0.92);
            --correct: #4caf50;
            --wrong: #f44336;
            --era-color: #2b5876;
            --era-accent: #4e4376;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0e14;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
            overflow: hidden;
            color: #fff;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transition: opacity 0.5s, transform 0.5s;
            animation: zoomIn 30s linear infinite paused;
            transform-origin: center center;
            filter: brightness(0.65);
        }

        @keyframes zoomIn { from { transform: scale(1.0); } to { transform: scale(1.25); } }

        .screen {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: none; flex-direction: column; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.55);
        }
        .active { display: flex; }

        /* ヘッダー・UI */
        #header-zone {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            font-weight: bold; font-size: 1.1rem;
        }
        
        #dialogue-zone {
            margin: auto 20px 15px 20px; padding: 20px;
            background: var(--dark); backdrop-filter: blur(10px);
            border-left: 5px solid var(--gold); border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 50vh; overflow-y: auto;
        }

        .question-badge {
            display: inline-block; background: var(--gold); color: #000;
            padding: 2px 10px; border-radius: 4px; font-weight: bold;
            font-size: 0.85rem; margin-bottom: 8px; font-family: sans-serif;
        }

        #dialogue { font-size: 1.15rem; line-height: 1.6; }

        #info-area {
            margin-top: 15px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.2);
            font-size: 0.95rem; color: #ddd; font-family: sans-serif; line-height: 1.5;
        }

        #input-zone {
            padding: 0 20px 30px 20px; display: flex; flex-direction: column; align-items: center;
            width: 100%; box-sizing: border-box;
        }

        /* 選択肢ボタン (ラジオボタンスタイル) */
        .options-grid {
            display: grid; grid-template-columns: 1fr; gap: 10px;
            width: 100%; max-width: 550px; margin-bottom: 15px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 20px; border-radius: 8px; font-size: 1rem; text-align: left;
            cursor: pointer; transition: all 0.2s; font-family: sans-serif;
        }
        .option-btn:hover { background: rgba(212, 175, 55, 0.3); border-color: var(--gold); }

        input[type="text"] {
            width: 100%; max-width: 500px; padding: 15px; font-size: 1.2rem;
            border: 2px solid var(--gold); border-radius: 30px; text-align: center;
            margin-bottom: 15px; background: rgba(255,255,255,0.95); color: #000;
            outline: none; font-family: sans-serif;
        }

        .menu-btn {
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: #fff; border: 1px solid var(--gold);
            padding: 15px 30px; border-radius: 30px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; width: 100%; max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.1s, filter 0.2s;
            font-family: sans-serif;
        }
        .menu-btn:active { transform: scale(0.98); }

        /* 称号スタイル */
        .title-display {
            font-size: 1.4rem; color: var(--gold);
            background: rgba(212,175,55,0.1); padding: 10px 25px;
            border-radius: 50px; margin: 15px 0; border: 2px solid var(--gold);
            text-shadow: 0 0 10px rgba(212,175,55,0.5); font-weight: bold;
        }

        /* ランキングテーブル */
        .ranking-table {
            width: 100%; margin-top: 10px; border-collapse: collapse; color: #fff;
            font-size: 0.85rem; font-family: sans-serif;
        }
        .ranking-table th, .ranking-table td { border-bottom: 1px solid rgba(255,255,255,0.15); padding: 8px; text-align: left; }
        .ranking-table th { background: rgba(255,255,255,0.1); color: var(--gold); }
        .gold-rank { color: var(--gold); font-weight: bold; }

        .wrong-flash { animation: screenShake 0.15s 2; background-color: rgba(244, 67, 54, 0.3) !important; }
        @keyframes screenShake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-6px,6px); } 75% { transform: translate(6px,-6px); } }
    </style>
</head>
<body>

    <img id="bg-image" src="" alt="背景画像">

    <!-- 1. 名乗り画面 -->
    <div id="name-screen" class="screen active" style="justify-content: center; align-items: center; text-align: center; padding: 20px;">
        <h1 style="color:var(--gold); font-size: 2.2rem; margin-bottom: 5px; text-shadow: 0 2px 8px #000;">室町歴史検定</h1>
        <p style="color: #ccc; margin-bottom: 30px; font-family: sans-serif;">〜幕府の成立・社会文化・全26問〜</p>
        <h3 style="color:#fff; font-size: 1.2rem;">名乗りを上げよ</h3>
        <input type="text" id="player-name" placeholder="名前を入力（例：足利尊氏）" maxlength="12">
        <button class="menu-btn" onclick="goToEraSelect()">いざ、出陣</button>
    </div>

    <!-- 2. コース選択画面 -->
    <div id="era-screen" class="screen" style="justify-content: center; align-items: center; padding: 20px;">
        <h2 style="color:#fff; margin-bottom: 25px;">挑戦する編を選択せよ、<span id="display-player-name" style="color:var(--gold);"></span>殿</h2>
        <button class="menu-btn" onclick="startGame('part1')" style="margin-bottom:15px;">【第1部】選択式編（問1〜問7）</button>
        <button class="menu-btn" onclick="startGame('part2')" style="margin-bottom:15px;">【第2・3部】記述編（問8〜問26）</button>
        <button class="menu-btn" onclick="startGame('all')" style="background: linear-gradient(135deg, #b78628 0%, #d4af37 100%); color:#000;">【全問合戦】完全攻略（全26問）</button>
    </div>

    <!-- 3. ゲームメイン画面 -->
    <div id="game-screen" class="screen">
        <div id="header-zone">
            <div id="game-progress">問 1 / 26</div>
            <div id="current-score-display" style="color:var(--gold);">スコア: 0</div>
            <div id="timer-text">残り 45秒</div>
        </div>
        <div id="dialogue-zone">
            <div id="question-type-badge" class="question-badge">選択問題</div>
            <div id="dialogue"></div>
            <div id="info-area" style="display:none;"></div>
        </div>
        <div id="input-zone">
            <!-- 選択式（問1〜7用） -->
            <div id="options-container" class="options-grid" style="display:none;"></div>

            <!-- 記述式（問8〜26用） -->
            <input type="text" id="user-answer" placeholder="ここに答えを入力" autocomplete="off" style="display:none;">
            <button id="submit-btn" class="menu-btn" onclick="checkTextAttempt()" style="display:none;">回答する</button>

            <!-- 次へ進むボタン -->
            <button id="next-btn" class="menu-btn" style="display:none; background: var(--gold); color: #000;" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>

    <!-- 4. 結果発表画面 -->
    <div id="result-screen" class="screen" style="justify-content: center; align-items: center; padding: 20px; overflow-y: auto;">
        <h1 style="color:var(--gold); margin-bottom:5px; text-shadow: 0 0 10px rgba(212,175,55,0.5);">戦績発表</h1>
        <div id="final-stats" style="color:#fff; text-align:center;"></div>
        
        <div id="title-area" class="title-display"></div>
        
        <div style="background:rgba(0,0,0,0.7); padding:15px 20px; border-radius:12px; width:100%; max-width:450px; margin-top:10px; border: 1px solid rgba(255,255,255,0.2);">
            <h3 style="color:var(--gold); margin:0 0 8px 0; text-align:center; font-family:sans-serif;">殿堂入り（TOP 5）</h3>
            <table class="ranking-table" id="ranking-list"></table>
        </div>
        
        <button class="menu-btn" onclick="location.reload()" style="margin-top:20px;">再挑戦する</button>
    </div>

            id: 22, type: "text", name: "芸能文化",
            img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
            msg: "室町時代に観阿弥・世阿弥の親子が足利義満の保護を受けて大成させた、歌舞・演劇の芸能は何か。",
            answers: ["能", "能楽", "のう", "のうがく"],
            info: "世阿弥は理論書『風姿花伝』を書き著しました。"
        },
        {
            id: 23, type: "text", name: "戦国時代の社会風潮",
            img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
            msg: "身分の低い者が上の者を実力で倒して取って代わる、戦国時代の社会風潮・現象を漢字4文字で何と呼ぶか。",
            answers: ["下剋上", "下克上", "げこくじょう"],
            info: "実力主義の風潮が高まり、守護大名に代わって戦国大名が登場しました。"
        },

        // --- 第3部：論述・説明形式（問24〜26） ---
        {
            id: 24, type: "text", name: "戦国大名の政策（楽市・楽座）",
            img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
            msg: "【説明問題】戦国大名が城下町へ商人や手工業者を集めるために実施した「楽市・楽座」政策の目的と内容をキーワードを入れて答えよ。（キーワード例：座、特権、城下町、自由）",
            answers: ["座", "特権", "自由", "楽市", "楽座"],
            info: "【模範解答】独占販売権を持つ「座」の特権を解消し、関所などを廃止して自由な取引を認めることで、商工業者を惹きつけ城下町と領国経済を活性化させるため。"
        },
        {
            id: 25, type: "text", name: "分国法（喧嘩両成敗）",
            img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
            msg: "【説明問題】戦国大名が制定した分国法にある「喧嘩両成敗」の規定目的を簡潔に説明しなさい。（キーワード例：私闘、統制、裁判）",
            answers: ["私闘", "統制", "裁判", "喧嘩", "禁止"],
            info: "【模範解答】家臣同士の私闘や武力衝突を理由を問わず禁止し、大名による裁定（統一的裁判権）に従わせることで領内治安と統制を強めるため。"
        },
        {
            id: 26, type: "text", name: "惣村の規範",
            img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
            msg: "【説明問題】惣村において、村の秩序や農作業・用水管理を維持するために農民たちが自主的に定めた規約を何と呼ぶか答えなさい。",
            answers: ["惣掟", "そうおきて", "地下掟", "じげおきて"],
            info: "【模範解答】惣掟（そうおきて）。違反者には「村八分」や「追放」などの厳しいペナルティが科されました。"
        }
    ];

    let playerName = "";
    let currentQuizList = [];
    let currentIdx = 0;
    let totalScore = 0;
    let correctCount = 0;
    let timeLeft = 45;
    let timerInterval = null;
    let isLocked = false;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToEraSelect() {
        playerName = document.getElementById('player-name').value.trim() || "無名の武士";
        document.getElementById('display-player-name').innerText = playerName;
        showScreen('era-screen');
    }

    function startGame(mode) {
        if (mode === 'part1') {
            currentQuizList = masterQuestions.filter(q => q.id <= 7);
        } else if (mode === 'part2') {
            currentQuizList = masterQuestions.filter(q => q.id >= 8);
        } else {
            currentQuizList = [...masterQuestions];
        }

        currentIdx = 0; totalScore = 0; correctCount = 0;
        showScreen('game-screen');
        loadQuestion();
    }

    function loadQuestion() {
        isLocked = false;
        const qData = currentQuizList[currentIdx];

        // 背景切り替え
        const bgImg = document.getElementById('bg-image');
        bgImg.src = qData.img;
        bgImg.style.animation = 'none'; bgImg.offsetHeight;
        bgImg.style.animation = 'zoomIn 30s linear 1 forwards';

        // UIリセット
        document.getElementById('dialogue-zone').classList.remove('wrong-flash');
        document.getElementById('question-type-badge').innerText = qData.type === 'choice' ? `【選択問題】問 ${qData.id}` : `【記述問題】問 ${qData.id}`;
        document.getElementById('dialogue').innerHTML = `<strong>${qData.name}：</strong><br>${qData.msg}`;
        document.getElementById('info-area').style.display = 'none';
        document.getElementById('game-progress').innerText = `進捗: ${currentIdx + 1} / ${currentQuizList.length}`;
        document.getElementById('current-score-display').innerText = `スコア: ${totalScore}`;

        const optionsContainer = document.getElementById('options-container');
        const textInput = document.getElementById('user-answer');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.style.display = 'none';

        if (qData.type === 'choice') {
            textInput.style.display = 'none';
            submitBtn.style.display = 'none';
            optionsContainer.style.display = 'grid';
            optionsContainer.innerHTML = '';

            qData.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkChoiceAttempt(i);
                optionsContainer.appendChild(btn);
            });
        } else {
            optionsContainer.style.display = 'none';
            textInput.style.display = 'block';
            submitBtn.style.display = 'block';
            textInput.value = '';
            textInput.disabled = false;
            setTimeout(() => textInput.focus(), 300);
        }

        timeLeft = 45;
        updateTimerUI();
        startTimerLoop();
    }

    function startTimerLoop() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 1;
            updateTimerUI();
            if (timeLeft <= 0) finishQuestion('timeout');
        }, 1000);
    }

    function updateTimerUI() {
        const el = document.getElementById('timer-text');
        el.innerText = `残り ${Math.max(0, timeLeft)}秒`;
        el.style.color = timeLeft <= 10 ? "#ff4444" : "#fff";
    }

    // 選択式解答判定
    function checkChoiceAttempt(selectedIdx) {
        if (isLocked) return;
        const qData = currentQuizList[currentIdx];
        if (selectedIdx === qData.correctIdx) {
            correctCount++;
            totalScore += 1000 + (timeLeft * 20);
            finishQuestion('correct');
        } else {
            handleWrong();
        }
    }

    // 記述式解答判定
    function checkTextAttempt() {
        if (isLocked) return;
        const qData = currentQuizList[currentIdx];
        const val = document.getElementById('user-answer').value.trim();
        if (!val) return;

        // キーワード・文字列合致チェック
        const isCorrect = qData.answers.some(ans => val.includes(ans) || ans.includes(val));

        if (isCorrect) {
            correctCount++;
            totalScore += 1200 + (timeLeft * 20);
            finishQuestion('correct');
        } else {
            handleWrong();
        }
    }

    function handleWrong() {
        isLocked = true;
        timeLeft = Math.max(0, timeLeft - 5);
        updateTimerUI();
        const dZone = document.getElementById('dialogue-zone');
        dZone.classList.add('wrong-flash');
        
        if (timeLeft <= 0) {
            finishQuestion('timeout');
            return;
        }

        setTimeout(() => {
            dZone.classList.remove('wrong-flash');
            isLocked = false;
        }, 600);
    }

    function finishQuestion(result) {
        clearInterval(timerInterval);
        isLocked = true;
        const qData = currentQuizList[currentIdx];

        document.getElementById('options-container').style.display = 'none';
        document.getElementById('user-answer').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';

        const dEl = document.getElementById('dialogue');
        const infoEl = document.getElementById('info-area');

        if (result === 'correct') {
            dEl.innerHTML = `<span style="color:var(--correct); font-weight:bold;">【 見事正解！ 】</span><br><strong>${qData.name}：</strong> 素晴らしい知識じゃ！`;
        } else {
            dEl.innerHTML = `<span style="color:var(--wrong); font-weight:bold;">【 無念... 時の終局 】</span><br><strong>正解：</strong> ${qData.answers ? qData.answers[0] : qData.options[qData.correctIdx]}`;
        }

        infoEl.innerHTML = `<strong>【解説・詳細】</strong><br>${qData.info}`;
        infoEl.style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < currentQuizList.length) {
            loadQuestion();
        } else {
            showFinalResult();
        }
    }

    function getTitle(score, correct, total) {
        const ratio = correct / total;
        if (ratio === 1.0 && score > 25000) return "室町幕府の至宝";
        if (ratio >= 0.8) return "室町の大将軍";
        if (ratio >= 0.6) return "惣村の有力指導者";
        if (ratio >= 0.3) return "気鋭の町衆";
        return "通りすがりのバサラ";
    }

    function showFinalResult() {
        showScreen('result-screen');
        const totalCount = currentQuizList.length;
        const myTitle = getTitle(totalScore, correctCount, totalCount);

        document.getElementById('final-stats').innerHTML = `
            <p style="margin:0; font-size:1.1rem;">${playerName} 殿の戦果</p>
            <div style="font-size:2.8rem; color:var(--gold); font-weight:bold; margin: 10px 0;">${totalScore.toLocaleString()} 点</div>
            <p style="margin:0;">（正解数: ${correctCount} / ${totalCount} 問）</p>
        `;

        document.getElementById('title-area').innerText = `称号：${myTitle}`;
        saveAndDisplayRanking(myTitle);
    }

    function saveAndDisplayRanking(myTitle) {
        let ranking = JSON.parse(localStorage.getItem('muromachiQuizRanking') || '[]');
        ranking.push({
            name: playerName,
            score: totalScore,
            title: myTitle,
            date: new Date().toLocaleDateString()
        });

        ranking.sort((a, b) => b.score - a.score);
        ranking = ranking.slice(0, 5);
        localStorage.setItem('muromachiQuizRanking', JSON.stringify(ranking));

        const listEl = document.getElementById('ranking-list');
        listEl.innerHTML = `<tr><th>順位</th><th>武将名 (称号)</th><th>得点</th></tr>`;
        ranking.forEach((entry, index) => {
            const isMe = (entry.name === playerName && entry.score === totalScore && entry.title === myTitle);
            listEl.innerHTML += `
                <tr style="${isMe ? 'background:rgba(212,175,55,0.25);' : ''}">
                    <td class="${index === 0 ? 'gold-rank' : ''}">${index + 1}位</td>
                    <td>${entry.name} <span style="font-size:0.75em; color:#bbb;">(${entry.title})</span></td>
                    <td>${entry.score.toLocaleString()}</td>
                </tr>`;
        });
    }

    document.getElementById('user-answer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkTextAttempt();
    });
</script>
</body>
</html>
