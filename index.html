<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI歴史検定 - 完全対応版</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark: rgba(20, 24, 33, 0.92);
            --correct: #4caf50;
            --wrong: #f44336;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0e14;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
            overflow: hidden;
            color: #fff;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transition: opacity 0.5s, transform 0.5s;
            animation: zoomIn 30s linear infinite paused;
            transform-origin: center center;
            filter: brightness(0.65);
        }

        @keyframes zoomIn { from { transform: scale(1.0); } to { transform: scale(1.25); } }

        .screen {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: none; flex-direction: column; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.55);
        }
        .active { display: flex; }

        #header-zone {
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            font-weight: bold; font-size: 1rem; flex-wrap: wrap; gap: 8px;
        }
        
        .header-item { display: flex; align-items: center; gap: 15px; }

        .retreat-btn {
            background: rgba(244, 67, 54, 0.2); color: #ff8a80; border: 1px solid #ff5252;
            padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; cursor: pointer;
            font-family: sans-serif; transition: all 0.2s;
        }
        .retreat-btn:hover { background: rgba(244, 67, 54, 0.4); color: #fff; }

        #dialogue-zone {
            margin: auto 20px 15px 20px; padding: 20px;
            background: var(--dark); backdrop-filter: blur(10px);
            border-left: 5px solid var(--gold); border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 50vh; overflow-y: auto;
        }

        .question-badge {
            display: inline-block; background: var(--gold); color: #000;
            padding: 2px 10px; border-radius: 4px; font-weight: bold;
            font-size: 0.85rem; margin-bottom: 8px; font-family: sans-serif;
        }

        #dialogue { font-size: 1.15rem; line-height: 1.6; }

        #hint-box {
            margin-top: 12px; padding: 10px 14px; background: rgba(212, 175, 55, 0.15);
            border-left: 4px solid var(--gold); border-radius: 4px;
            font-size: 0.95rem; color: #ffeb3b; font-family: sans-serif; display: none;
        }

        #info-area {
            margin-top: 15px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.2);
            font-size: 0.95rem; color: #ddd; font-family: sans-serif; line-height: 1.5;
        }

        #input-zone {
            padding: 0 20px 30px 20px; display: flex; flex-direction: column; align-items: center;
            width: 100%; box-sizing: border-box;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr; gap: 10px;
            width: 100%; max-width: 550px; margin-bottom: 15px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 20px; border-radius: 8px; font-size: 1rem; text-align: left;
            cursor: pointer; transition: all 0.2s; font-family: sans-serif;
        }
        .option-btn:hover { background: rgba(212, 175, 55, 0.3); border-color: var(--gold); }

        .text-input-container {
            display: flex; gap: 10px; width: 100%; max-width: 550px; margin-bottom: 15px;
        }
        .text-input {
            flex: 1; padding: 14px 18px; font-size: 1.1rem; border-radius: 8px;
            border: 2px solid var(--gold); background: rgba(255,255,255,0.95); color: #000;
            outline: none; font-family: sans-serif;
        }

        .menu-btn {
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            color: #fff; border: 1px solid var(--gold);
            padding: 15px 30px; border-radius: 30px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; width: 100%; max-width: 340px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-family: sans-serif;
        }

        .mode-selector {
            display: flex; gap: 4px; margin-bottom: 25px; background: rgba(0,0,0,0.5);
            padding: 6px; border-radius: 30px; border: 1px solid var(--gold);
            width: 100%; max-width: 420px; box-sizing: border-box;
        }
        .mode-btn {
            flex: 1; padding: 10px 8px; border-radius: 20px; border: none; background: transparent;
            color: #aaa; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 0.9rem;
            text-align: center; white-space: nowrap;
        }
        .mode-btn.active {
            background: var(--gold); color: #000; box-shadow: 0 0 10px rgba(212,175,55,0.5);
        }

        #hint-btn {
            background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 8px 20px; border-radius: 20px; font-size: 0.9rem;
            cursor: pointer; margin-top: 10px; display: none; font-family: sans-serif;
        }
        #hint-btn:hover { background: rgba(212, 175, 55, 0.2); }

        .title-display {
            font-size: 1.4rem; color: var(--gold);
            background: rgba(212,175,55,0.1); padding: 10px 25px;
            border-radius: 50px; margin: 15px 0; border: 2px solid var(--gold);
            text-shadow: 0 0 10px rgba(212,175,55,0.5); font-weight: bold;
        }

        .ranking-table, .review-table {
            width: 100%; margin-top: 10px; border-collapse: collapse; color: #fff;
            font-size: 0.85rem; font-family: sans-serif;
        }
        .ranking-table th, .ranking-table td, .review-table th, .review-table td {
            border-bottom: 1px solid rgba(255,255,255,0.15); padding: 10px 8px; text-align: left;
        }
        .ranking-table th, .review-table th { background: rgba(255,255,255,0.1); color: var(--gold); }
        .gold-rank { color: var(--gold); font-weight: bold; }
        
        .badge-correct { color: #4caf50; font-weight: bold; }
        .badge-wrong { color: #f44336; font-weight: bold; }

        .wrong-flash { animation: screenShake 0.15s 2; background-color: rgba(244, 67, 54, 0.3) !important; }
        @keyframes screenShake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-6px,6px); } 75% { transform: translate(6px,-6px); } }
    </style>
</head>
<body>

    <img id="bg-image" src="" alt="背景画像">

    <!-- 1. 名乗り画面 -->
    <div id="name-screen" class="screen active" style="justify-content: center; align-items: center; text-align: center; padding: 20px;">
        <h1 style="color:var(--gold); font-size: 2.2rem; margin-bottom: 5px;">AI歴史検定</h1>
        <p style="color: #ccc; margin-bottom: 30px; font-family: sans-serif;">〜完全版〜</p>
        <h3 style="color:#fff; font-size: 1.2rem;">名乗りを上げよ</h3>
        <input type="text" id="player-name" placeholder="名前を入力（例：足利尊氏）" maxlength="12" style="width: 100%; max-width: 300px; padding: 12px; font-size: 1.1rem; border: 2px solid var(--gold); border-radius: 30px; text-align: center; margin-bottom: 20px; background: rgba(255,255,255,0.95); color: #000; outline: none;">
        <br>
        <button class="menu-btn" onclick="goToEraSelect()">いざ、出陣</button>
    </div>

    <!-- 2. コース・モード選択画面 -->
    <div id="era-screen" class="screen" style="justify-content: center; align-items: center; padding: 20px; overflow-y: auto;">
        <h2 style="color:#fff; margin-bottom: 15px; text-align: center;">合戦の条件を選べ、<span id="display-player-name" style="color:var(--gold);"></span>殿</h2>
        
        <div class="mode-selector">
            <button id="mode-choice-btn" class="mode-btn active" onclick="setPlayMode('choice')">四択</button>
            <button id="mode-text-btn" class="mode-btn" onclick="setPlayMode('text')">記述</button>
            <button id="mode-mixed-btn" class="mode-btn" onclick="setPlayMode('mixed')">混在</button>
        </div>

        <button class="menu-btn" onclick="loadCourse('muromachi.json', 'muromachi')" style="margin-bottom:12px;">【室町幕府編】挑戦する</button>
        <button class="menu-btn" onclick="loadCourse('sengoku.json', 'sengoku')" style="background: linear-gradient(135deg, #b78628 0%, #d4af37 100%); color:#000; margin-bottom:12px;">【織豊・戦国時代編】挑戦する</button>
        <button class="menu-btn" onclick="loadCourse('edo.json', 'edo')" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color:#fff; margin-bottom:12px;">【江戸時代 前期編】挑戦する</button>
        <button class="menu-btn" onclick="loadCourse('edo2.json', 'edo2')" style="background: linear-gradient(135deg, #fa8231 0%, #eb3b5a 100%); color:#fff; margin-bottom:12px;">【江戸時代 中後期編】挑戦する</button>
        <button class="menu-btn" onclick="loadCourse('kyouho.json', 'kyouho')" style="background: linear-gradient(135deg, #8e44ad 0%, #3498db 100%); color:#fff; margin-bottom:12px;">【享保の改革編】挑戦する</button>
        <button class="menu-btn" onclick="loadCourse('kaikoku.json', 'kaikoku')" style="background: linear-gradient(135deg, #c0392b 0%, #e67e22 100%); color:#fff; margin-bottom:12px;">【開国と幕末の動乱編】挑戦する</button>
    </div>

    <!-- 3. ゲームメイン画面 -->
    <div id="game-screen" class="screen">
        <div id="header-zone">
            <div class="header-item">
                <button class="retreat-btn" onclick="retreatToEraSelect()">🚩 撤退（戻る）</button>
                <div id="game-progress">問 1 / --</div>
            </div>
            <div class="header-item">
                <div id="current-score-display" style="color:var(--gold);">スコア: 0</div>
                <div id="timer-text">残り 30秒</div>
            </div>
        </div>
        <div id="dialogue-zone">
            <div id="question-type-badge" class="question-badge">四択形式</div>
            <div id="dialogue">問題を読み込んでいます...</div>
            
            <div id="hint-box"></div>
            <button id="hint-btn" onclick="showHint()">💡 ヒントを乞う</button>

            <div id="info-area" style="display:none;"></div>
        </div>
        <div id="input-zone">
            <div id="options-container" class="options-grid"></div>
            
            <div id="text-input-container" class="text-input-container" style="display:none;">
                <input type="text" id="text-answer-input" class="text-input" placeholder="解答を入力..." onkeydown="if(event.key === 'Enter') submitTextAnswer()">
                <button class="menu-btn" style="width: auto; padding: 0 25px; max-width: none;" onclick="submitTextAnswer()">判定</button>
            </div>

            <button id="next-btn" class="menu-btn" style="display:none; background: var(--gold); color: #000;" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>

    <!-- 4. 結果発表画面 -->
    <div id="result-screen" class="screen" style="justify-content: center; align-items: center; padding: 30px 20px; overflow-y: auto;">
        <h1 style="color:var(--gold); margin-bottom:5px;">戦績発表</h1>
        <div id="final-stats" style="color:#fff; text-align:center;"></div>
        <div id="title-area" class="title-display"></div>
        
        <div style="background:rgba(0,0,0,0.7); padding:15px 20px; border-radius:12px; width:100%; max-width:550px; margin-top:10px; border: 1px solid rgba(255,255,255,0.2);">
            <h3 style="color:var(--gold); margin:0 0 8px 0; text-align:center; font-family:sans-serif;">殿堂入り（TOP 5）</h3>
            <table class="ranking-table" id="ranking-list"></table>
        </div>

        <div style="background:rgba(0,0,0,0.7); padding:15px 20px; border-radius:12px; width:100%; max-width:550px; margin-top:20px; border: 1px solid rgba(255,255,255,0.2);">
            <h3 style="color:var(--gold); margin:0 0 10px 0; text-align:center; font-family:sans-serif;">全問題の解答レビュー</h3>
            <table class="review-table" id="review-list"></table>
        </div>
        
        <button class="menu-btn" onclick="location.reload()" style="margin-top:25px; margin-bottom:20px;">トップに戻る</button>
    </div>

<script>
    let playerName = "";
    let currentQuizList = [];
    let currentCourseKey = "";
    let hintData = {};
    let currentIdx = 0;
    let totalScore = 0;
    let correctCount = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isLocked = false;
    let wrongAttempts = 0;
    let playMode = "choice";
    let currentActiveQuestionMode = "choice";

    let currentShuffledOptions = [];
    let currentCorrectShuffledIdx = null;
    let questionHistory = [];

    function setPlayMode(mode) {
        playMode = mode;
        document.getElementById('mode-choice-btn').classList.toggle('active', mode === 'choice');
        document.getElementById('mode-text-btn').classList.toggle('active', mode === 'text');
        document.getElementById('mode-mixed-btn').classList.toggle('active', mode === 'mixed');
    }

    // 途中で問題選択画面（合戦の地選択）に戻る関数
    function retreatToEraSelect() {
        if (timerInterval) clearInterval(timerInterval); // タイマーを停止
        showScreen('era-screen');
    }

    function normalize(str) {
        if (!str) return '';
        return str
            .toString()
            .normalize('NFKC')
            .toLowerCase()
            .replace(/[〇零]/g, '0')
            .replace(/[一壱]/g, '1')
            .replace(/[二弐]/g, '2')
            .replace(/[三参]/g, '3')
            .replace(/[四]/g, '4')
            .replace(/[五]/g, '5')
            .replace(/[六]/g, '6')
            .replace(/[七]/g, '7')
            .replace(/[八]/g, '8')
            .replace(/[九]/g, '9')
            .replace(/[十]/g, '10')
            .replace(/[百]/g, '100')
            .replace(/[千]/g, '1000')
            .replace(/[万]/g, '10000')
            .replace(/[ケヶ]/g, 'ヶ')
            .replace(/[\s\u3000・／\/・ー〜・\-_]/g, '');
    }

    function getExpandedAnswers(rawAnswer) {
        if (!rawAnswer) return [];
        let list = [rawAnswer];
        let match = rawAnswer.match(/^(.+?)[\(（](.+?)[\)）]$/);
        if (match) {
            list.push(match[1].trim());
            list.push(match[2].trim());
        }
        return list;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToEraSelect() {
        playerName = document.getElementById('player-name').value.trim() || "無名の武士";
        document.getElementById('display-player-name').innerText = playerName;
        showScreen('era-screen');
    }

    async function loadCourse(jsonFileName, courseKey) {
        try {
            currentCourseKey = courseKey;
            
            const [quizRes, hintRes] = await Promise.all([
                fetch('./' + jsonFileName),
                fetch('./hint.json')
            ]);

            if (!quizRes.ok) throw new Error(`${jsonFileName} の取得に失敗しました`);
            if (!hintRes.ok) throw new Error('hint.json の取得に失敗しました');

            const rawData = await quizRes.json();
            currentQuizList = shuffleArray(rawData);
            hintData = await hintRes.json();

            currentIdx = 0; 
            totalScore = 0; 
            correctCount = 0;
            questionHistory = [];
            
            showScreen('game-screen');
            loadQuestion();
        } catch (error) {
            console.error(error);
            alert(`データの読み込みに失敗しました (${jsonFileName})。\n※ファイル名やパスに誤りがないかご確認ください。`);
        }
    }

    function extractCanonicalAnswer(qData) {
        if (qData.options && typeof qData.correctIdx !== 'undefined') {
            return qData.options[qData.correctIdx].replace(/^[A-D]\.\s*/, '').trim();
        }
        if (qData.answers && qData.answers.length > 0) {
            return qData.answers[0];
        }
        if (qData.target_word) {
            return qData.target_word;
        }
        if (qData.answer) {
            return qData.answer;
        }
        return "正解データなし";
    }

    function loadQuestion() {
        isLocked = false;
        wrongAttempts = 0;
        const qData = currentQuizList[currentIdx];

        const bgImg = document.getElementById('bg-image');
        bgImg.src = qData.img || "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80";
        bgImg.style.animation = 'none'; bgImg.offsetHeight;
        bgImg.style.animation = 'zoomIn 30s linear 1 forwards';

        document.getElementById('dialogue-zone').classList.remove('wrong-flash');
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('hint-box').innerText = '';
        document.getElementById('hint-btn').style.display = 'none';

        if (playMode === 'mixed') {
            currentActiveQuestionMode = Math.random() < 0.5 ? 'choice' : 'text';
        } else {
            currentActiveQuestionMode = playMode;
        }

        const modeBadgeLabel = currentActiveQuestionMode === 'choice' ? '四択形式' : '記述形式';
        const mixIndicator = playMode === 'mixed' ? ' (混在)' : '';
        document.getElementById('question-type-badge').innerText = `【${modeBadgeLabel}${mixIndicator}】第 ${currentIdx + 1} 問`;
        
        document.getElementById('dialogue').innerHTML = `${qData.msg}`;
        document.getElementById('info-area').style.display = 'none';
        document.getElementById('game-progress').innerText = `進捗: ${currentIdx + 1} / ${currentQuizList.length}`;
        document.getElementById('current-score-display').innerText = `スコア: ${totalScore}`;

        const optionsContainer = document.getElementById('options-container');
        const textInputContainer = document.getElementById('text-input-container');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.style.display = 'none';

        if (currentActiveQuestionMode === 'choice') {
            textInputContainer.style.display = 'none';
            optionsContainer.style.display = 'grid';
            optionsContainer.innerHTML = '';

            let optionsWithFlag = (qData.options || []).map((optText, i) => {
                return {
                    text: optText,
                    isOriginalCorrect: (i === qData.correctIdx)
                };
            });

            shuffleArray(optionsWithFlag);
            currentShuffledOptions = optionsWithFlag;

            const prefixes = ["A. ", "B. ", "C. ", "D. "];
            currentShuffledOptions.forEach((item, index) => {
                if (item.isOriginalCorrect) {
                    currentCorrectShuffledIdx = index;
                }

                const btn = document.createElement('button');
                btn.className = 'option-btn';
                let cleanText = item.text.replace(/^[A-D]\.\s*/, '');
                btn.innerText = prefixes[index] + cleanText;

                btn.onclick = () => checkChoiceAttempt(index);
                optionsContainer.appendChild(btn);
            });
        } else {
            optionsContainer.style.display = 'none';
            textInputContainer.style.display = 'flex';
            const textInput = document.getElementById('text-answer-input');
            textInput.value = '';
            textInput.disabled = false;
            textInput.focus();
        }

        timeLeft = 30;
        updateTimerUI();
        startTimerLoop();
    }

    function startTimerLoop() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 1;
            updateTimerUI();
            if (timeLeft <= 0) finishQuestion('timeout');
        }, 1000);
    }

    function updateTimerUI() {
        const el = document.getElementById('timer-text');
        el.innerText = `残り ${Math.max(0, timeLeft)}秒`;
        el.style.color = timeLeft <= 10 ? "#ff4444" : "#fff";
    }

    function checkChoiceAttempt(selectedIdx) {
        if (isLocked) return;
        
        const chosenText = currentShuffledOptions[selectedIdx].text.replace(/^[A-D]\.\s*/, '');
        const correctText = extractCanonicalAnswer(currentQuizList[currentIdx]);

        if (selectedIdx === currentCorrectShuffledIdx) {
            correctCount++;
            totalScore += 1000 + (timeLeft * 20);
            
            questionHistory.push({
                question: currentQuizList[currentIdx].msg,
                userAnswer: chosenText,
                correctAnswer: correctText,
                isCorrect: true
            });

            finishQuestion('correct');
        } else {
            handleWrong(chosenText, correctText);
        }
    }

    function submitTextAnswer() {
        if (isLocked) return;
        const textInput = document.getElementById('text-answer-input');
        const userInput = textInput.value.trim();
        if (!userInput) return;

        const qData = currentQuizList[currentIdx];
        const canonical = extractCanonicalAnswer(qData);
        
        let rawAcceptable = [];
        if (qData.answers) rawAcceptable = rawAcceptable.concat(qData.answers);
        if (qData.options && typeof qData.correctIdx !== 'undefined') rawAcceptable.push(canonical);
        if (qData.target_word) rawAcceptable.push(qData.target_word);
        if (qData.answer) rawAcceptable.push(qData.answer);
        if (canonical && !rawAcceptable.includes(canonical)) rawAcceptable.push(canonical);

        let acceptableAnswers = [];
        rawAcceptable.forEach(ans => {
            acceptableAnswers = acceptableAnswers.concat(getExpandedAnswers(ans));
        });

        const normInput = normalize(userInput);
        const isMatched = acceptableAnswers.some(ans => normalize(ans) === normInput);

        if (isMatched) {
            correctCount++;
            totalScore += 1000 + (timeLeft * 20);
            
            questionHistory.push({
                question: qData.msg,
                userAnswer: userInput,
                correctAnswer: canonical,
                isCorrect: true
            });

            finishQuestion('correct');
        } else {
            handleWrong(userInput, canonical);
        }
    }

    function handleWrong(chosenText, correctText) {
        if (isLocked) return;
        isLocked = true;
        wrongAttempts++;
        timeLeft = Math.max(0, timeLeft - 5);
        updateTimerUI();

        const dZone = document.getElementById('dialogue-zone');
        dZone.classList.add('wrong-flash');
        
        if (wrongAttempts >= 3 || timeLeft <= 0) {
            if (!questionHistory.some(h => h.question === currentQuizList[currentIdx].msg)) {
                questionHistory.push({
                    question: currentQuizList[currentIdx].msg,
                    userAnswer: chosenText || "時間切れ / 未回答",
                    correctAnswer: correctText,
                    isCorrect: false
                });
            }

            setTimeout(() => {
                dZone.classList.remove('wrong-flash');
                finishQuestion('wrong_limit');
            }, 300);
            return;
        }

        document.getElementById('hint-btn').style.display = 'inline-block';
        setTimeout(() => {
            dZone.classList.remove('wrong-flash');
            isLocked = false;
        }, 300);
    }

    function showHint() {
        const qData = currentQuizList[currentIdx];
        const hintBox = document.getElementById('hint-box');
        
        let hintText = "ヒントが登録されていません。";
        try {
            if (hintData[currentCourseKey] && hintData[currentCourseKey][qData.id]) {
                hintText = hintData[currentCourseKey][qData.id];
            }
        } catch (e) {
            console.error(e);
        }

        hintBox.innerHTML = `<strong>【ヒント】</strong> ${hintText}`;
        hintBox.style.display = 'block';
        document.getElementById('hint-btn').style.display = 'none';
    }

    function finishQuestion(result) {
        clearInterval(timerInterval);
        isLocked = true;
        const qData = currentQuizList[currentIdx];

        document.getElementById('options-container').style.display = 'none';
        document.getElementById('text-input-container').style.display = 'none';
        document.getElementById('hint-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';

        const dEl = document.getElementById('dialogue');
        const infoEl = document.getElementById('info-area');
        const correctText = extractCanonicalAnswer(qData);

        if (!questionHistory.some(h => h.question === qData.msg)) {
            questionHistory.push({
                question: qData.msg,
                userAnswer: "時間切れ / 未回答",
                correctAnswer: correctText,
                isCorrect: false
            });
        }

        if (result === 'correct') {
            dEl.innerHTML = `<span style="color:var(--correct); font-weight:bold;">【 見事正解！ 】</span><br>正解じゃ！`;
        } else {
            const msgTitle = result === 'wrong_limit' ? '【 3回連続誤答... 無念！ 】' : '【 無念... 時の終局 】';
            dEl.innerHTML = `<span style="color:var(--wrong); font-weight:bold;">${msgTitle}</span><br><strong>正解：</strong> ${correctText}`;
        }

        infoEl.innerHTML = `<strong>【解説・詳細】</strong><br>${qData.info}`;
        infoEl.style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < currentQuizList.length) {
            loadQuestion();
        } else {
            showFinalResult();
        }
    }

    function getTitle(score, correct, total) {
        const ratio = correct / total;
        if (ratio === 1.0) return "歴史の至宝";
        if (ratio >= 0.8) return "歴戦の大将軍";
        if (ratio >= 0.6) return "気鋭の武将";
        return "新進気鋭の志士";
    }

    function showFinalResult() {
        showScreen('result-screen');
        const totalCount = currentQuizList.length;
        const myTitle = getTitle(totalScore, correctCount, totalCount);

        let modeLabelText = "四択形式";
        if (playMode === 'text') modeLabelText = "記述形式";
        if (playMode === 'mixed') modeLabelText = "混在形式";

        document.getElementById('final-stats').innerHTML = `
            <p style="margin:0; font-size:1.1rem;">${playerName} 殿の戦果 （${modeLabelText}）</p>
            <div style="font-size:2.8rem; color:var(--gold); font-weight:bold; margin: 10px 0;">${totalScore.toLocaleString()} 点</div>
            <p style="margin:0;">（正解数: ${correctCount} / ${totalCount} 問）</p>
        `;

        document.getElementById('title-area').innerText = `称号：${myTitle}`;
        saveAndDisplayRanking(myTitle, modeLabelText);
        displayReviewList();
    }

    function saveAndDisplayRanking(myTitle, modeLabelText) {
        let ranking = JSON.parse(localStorage.getItem('independentHintRanking') || '[]');
        ranking.push({
            name: `${playerName} (${modeLabelText})`,
            score: totalScore,
            title: myTitle,
            date: new Date().toLocaleDateString()
        });

        ranking.sort((a, b) => b.score - a.score);
        ranking = ranking.slice(0, 5);
        localStorage.setItem('independentHintRanking', JSON.stringify(ranking));

        const listEl = document.getElementById('ranking-list');
        listEl.innerHTML = `<tr><th>順位</th><th>武将名 (称号)</th><th>得点</th></tr>`;
        ranking.forEach((entry, index) => {
            const isMe = (entry.name.startsWith(playerName) && entry.score === totalScore && entry.title === myTitle);
            listEl.innerHTML += `
                <tr style="${isMe ? 'background:rgba(212,175,55,0.25);' : ''}">
                    <td class="${index === 0 ? 'gold-rank' : ''}">${index + 1}位</td>
                    <td>${entry.name} <span style="font-size:0.75em; color:#bbb;">(${entry.title})</span></td>
                    <td>${entry.score.toLocaleString()}</td>
                </tr>`;
        });
    }

    function displayReviewList() {
        const reviewEl = document.getElementById('review-list');
        reviewEl.innerHTML = `<tr><th>問</th><th>問題 / あなたの回答</th><th>正解</th></tr>`;
        
        questionHistory.forEach((item, index) => {
            const badge = item.isCorrect 
                ? `<span class="badge-correct">⭕ 正解</span>` 
                : `<span class="badge-wrong">❌ 不正解</span>`;
            
            reviewEl.innerHTML += `
                <tr>
                    <td style="font-weight:bold; vertical-align:top;">${index + 1}</td>
                    <td style="vertical-align:top;">
                        <div style="margin-bottom:4px;">${item.question}</div>
                        <div style="font-size:0.85rem; color:#ccc;">回答: ${item.userAnswer}</div>
                    </td>
                    <td style="vertical-align:top; color:var(--gold);">
                        <div>${item.correctAnswer}</div>
                        <div style="margin-top:4px;">${badge}</div>
                    </td>
                </tr>
            `;
        });
    }
</script>
</body>
</html>
